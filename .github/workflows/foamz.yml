name: FOAMZ
on:
  workflow_dispatch:
    inputs:
      task: {description: "setup = unpack the zips, mint = mint NFTs", type: choice, options: [mint, setup], default: mint}
      network: {description: "testnet or mainnet", type: choice, options: [mainnet, testnet], default: mainnet}
      batch: {description: "Drop 1 batch (1-10), 0 = all 25 Mythics, 11 = Bitcoinciaga collab", default: "1"}
      ids: {description: "Or FOAMZ numbers, e.g. 1,25,33", default: ""}
      limit: {description: "Only first N (e.g. 2 to test). Empty = whole batch", default: ""}
permissions:
  contents: write
concurrency: foamz
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup (unpack zips)
        if: inputs.task == 'setup'
        run: |
          ls foamz_kit_*.zip >/dev/null 2>&1 || { echo "Nothing to unpack - the kit is already unpacked. Use task = mint."; exit 0; }
          for f in foamz_kit_*.zip; do unzip -o -q "$f"; git rm -q "$f"; done
          git config user.name foamz-bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -q -m "unpack FOAMZ Drop 1 kit" && git push
          echo "Unpacked: $(ls covers | wc -l) covers, $(ls lottie | wc -l) animations"
      - name: Mint
        if: inputs.task == 'mint'
        env:
          NETWORK: ${{ inputs.network }}
          GETGEMS_API_KEY: ${{ inputs.network == 'mainnet' && secrets.GETGEMS_API_KEY_MAINNET || secrets.GETGEMS_API_KEY_TESTNET }}
          COLLECTION: ${{ inputs.network == 'mainnet' && (vars.COLLECTION_MAINNET || secrets.COLLECTION_MAINNET || 'EQDqMBKj6zr47OKeHOCumTvpurRaOdSmktO9eReIrevYeTHR') || (vars.COLLECTION_TESTNET || secrets.COLLECTION_TESTNET) }}
          OWNER: ${{ inputs.network == 'mainnet' && (vars.OWNER_MAINNET || secrets.OWNER_MAINNET || 'UQCbuVnAnllyc36NvkHFy0HO2PiHEPXyHDS0mZV1VZ33lUBC') || (vars.OWNER_TESTNET || secrets.OWNER_TESTNET) }}
          ASSETS_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ -n "${{ inputs.ids }}" ]; then ARGS="--ids ${{ inputs.ids }}"; else ARGS="--batch ${{ inputs.batch }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python mint.py $ARGS
      - name: Save mint log
        if: always() && inputs.task == 'mint'
        run: |
          git config user.name foamz-bot && git config user.email bot@users.noreply.github.com
          git add minted.json 2>/dev/null && git commit -q -m "mint log" && git push || true
